name: Hello World Workflow

on:
  push:
    branches:
      - "*"  
  pull_request:
    branches:
      - "*"  

jobs:
  build:
    name: api-ci
    runs-on: ubuntu-latest

    if: ${{ (vars.ALLOWED_BRANCHES == github.ref_name && github.event_name == 'pull_request') || 
            (github.event_name == 'push' && vars.ALLOWED_BRANCHES == github.ref_name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello World - this is PR or Push trigger"
