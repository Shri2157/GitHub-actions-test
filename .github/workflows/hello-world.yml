name: Hello World Workflow

on:
  push:
    branches:
      - "*"  
  pull_request:
    branches:
      - "*"  

jobs:
  build:
    name: api-ci
    runs-on: ubuntu-latest

    if: ${{ 
      (github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'feature/'))) ||
      (github.event_name == 'pull_request' && (github.ref_name == 'main' || startsWith(github.ref_name, 'feature/')))}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"

      - name: Say Hello
        run: echo "Hello World - matched allowed branches!"
